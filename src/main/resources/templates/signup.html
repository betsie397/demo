<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Practice Tracker</title>
        <link th:href="@{/styles.css}" type="text/css" rel="stylesheet">
    </head>

    <body>
        <div class="title">
            <h1>Music Tracker</h1>
        </div>

        <div id="form">
            <form style="visibility: visible" action="#" th:action="@{/sign-up}" th:object="${user}" method="post">
                <h3>Sign Up</h3>
                <br>
                <p style="visibility: hidden; color: red;">Password do not match, please try again</p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <br>
                </br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br>
                <br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <br>
                <br>
                <label for="password">Confirm password:</label>
                <input type="password" id="password" name="confirm-password" required>
                <br>
                <br>
                <button type="button" th:onclick="|window.location.href='@{/login}'|">Login</button>
                <input type="submit" value="Submit" id="submit">
            </form>
        </div>
    </body>
</html>
