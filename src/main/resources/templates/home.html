
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Practice Tracker</title>
        <link th:href="@{/styles.css}" type="text/css" rel="stylesheet">
        <script th:src="@{/form.js}"></script>
        <script th:src="@{/table.js}"></script>
        <script th:src="@{/instruments.js}"></script>
        <script th:src="@{/delete_entry.js}"></script>
        <script th:src="@{/edit_entry.js}"></script>
    </head>

    <body>
        <div class="title">
            <h1>Music Tracker</h1>
        </div>

        <div class="navbar">
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/settings}">Settings</a>
            <a th:href="@{/login}">Logout</a>
        </div>

        <button type="button" onclick="showForm()">Click to add a new practice session</button> 
        <div id="form">
            <form action="#" th:action="@{/home}" method="post">
                <br>
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" th:attr="max=${today}" required>
                <br>
                <br>
                <label for="duration">Duration:</label>
                <input type="time" id="duration" name="duration" min="0" max="24" step="60" required>
                <br>
                <br>
                <label for="instrument">Instrument:</label>
                <select id="instrument" name="instrument" onchange="if (this.value === 'add') addInstruments();" required>
                    <option value="">Select an instrument</option>
                    <option value="add">Add Instrument</option>
                </select>
                <script th:inline="javascript">showInstruments([[${instruments}]], [[${options}]])</script>
                <br>
                <br>
                <label for="scales">Scales</label>
                <input type="checkbox" id="scales" name="scales" value="true">
                <br>
                <label for="exercises">Exercises/Studies</label>
                <input type="checkbox" id="exercises" name="exercises" value="true">
                <br>
                <label for="pieces">Pieces</label>
                <input type="checkbox" id="pieces" name="pieces" value="true">
                <br>
                <br>
                <label for="description">Description</label>
                <input type="longtext" id="description" name="description">
                <br>
                <br>
                <input type="submit" value="Submit" id="submit">
                <input type="Reset" value="Reset">
                <button type="Reset" onclick="hideForm()">Close</button>
            </form>
        </div>

        <div class="practice_log">
            <table id="table"></table>
            <script th:inline="javascript">showTable([[${data}]], [[${instruments}]]);</script>       
        </div>

    </body>
</html>
